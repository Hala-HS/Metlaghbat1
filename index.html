<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>metla غ bat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#006EE9;
  --blue-deep:#000180;
  --pink:#E7A0FE;
  --yellow:#D0FFA3;
  --green:#000180;
  --ink:#0B0B14;
  --paper:#FDFBF6;
  --card:#FFFFFF;
  --muted:#8a8a90;
  --max-w:1200px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#83E7FF;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
}

a{color:inherit; text-decoration:none;}
button{font-family:inherit; border:none; cursor:pointer; background:none;}

#app{
  max-width:var(--max-w);
  display:flex;
  flex-direction:column;
  margin:0 auto;
  background:
    radial-gradient(circle, rgba(11,11,20,.05) 1px, transparent 1px);
  background-size:14px 14px;
  background-color:#F8FAFF;
  min-height:100vh;
  box-shadow:0 0 40px rgba(0,0,0,.08);
  overflow-x:hidden;
  position:relative;
}

/* ============================================================
   HERO — collage/sticker aesthetic, matching the logo's own
   vintage-cutout + marker-scribble world
   ============================================================ */
.hero{
  background:var(--blue);
  padding:38px 22px 46px;
  position:relative;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.hero-bg .dots{
  position:absolute;
  inset:-10% -10%;
  background-image:radial-gradient(rgba(255,255,255,.14) 1.6px, transparent 1.6px);
  background-size:16px 16px;
  animation:dotsDrift 22s linear infinite;
}
@keyframes dotsDrift{
  from{transform:translate(0,0);}
  to{transform:translate(16px,16px);}
}
.hero-bg .blob{position:absolute; border-radius:50%; filter:blur(1px);}
.hero-bg .blob.b1{width:200px;height:200px; background:var(--pink); opacity:.22; top:-80px; right:-70px; animation:driftA 9s ease-in-out infinite;}
.hero-bg .blob.b2{width:130px;height:130px; background:var(--yellow); opacity:.16; bottom:-40px; left:-40px; animation:driftB 11s ease-in-out infinite;}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-16px,14px) scale(1.1);}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(12px,-12px) scale(1.08);}}

.hero-sticker{
  position:absolute;
  z-index:1;
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:9.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--yellow);
  padding:5px 10px;
  border-radius:6px;
  transform:rotate(-8deg);
  box-shadow:2px 3px 0 rgba(0,0,0,.18);
  top:18px; right:22px;
  animation:stickerIn .6s cubic-bezier(.2,.9,.3,1.2) .5s backwards, stickerSway 4s ease-in-out infinite 1.2s;
}
@keyframes stickerIn{from{opacity:0; transform:rotate(-8deg) scale(.6);} to{opacity:1; transform:rotate(-8deg) scale(1);}}
@keyframes stickerSway{0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(-4deg);}}

.logo-wrap{position:relative; z-index:2; display:inline-block;}
.logo{
  display:block;
  height:36px;
  width:auto;
  animation:logoDrop .7s cubic-bezier(.19,1,.22,1) backwards;
}
@keyframes logoDrop{from{opacity:0; transform:translateY(-16px) rotate(-2deg);} to{opacity:1; transform:translateY(0) rotate(0);}}

.scribble-circle{
  position:absolute;
  top:-14px; left:-22px;
  width:calc(100% + 44px);
  height:calc(100% + 30px);
  z-index:1;
  overflow:visible;
}
.scribble-circle path{
  fill:none;
  stroke:var(--yellow);
  stroke-width:3;
  stroke-linecap:round;
  stroke-dasharray:400;
  stroke-dashoffset:400;
  animation:drawScribble 1.1s ease-out .9s forwards;
  opacity:.85;
}
@keyframes drawScribble{to{stroke-dashoffset:0;}}

.hero-story{
  color:#fff;
  font-size:12.5px;
  line-height:1.7;
  margin-top:22px;
  position:relative;
  z-index:2;
  animation:fadeUp .7s cubic-bezier(.19,1,.22,1) .15s backwards;
}
.hero-story b{
  color:var(--ink);
  background:var(--yellow);
  padding:0 5px;
  border-radius:4px;
  display:inline-block;
  transform:rotate(-1.5deg);
}
.scroll-cue{
  margin-top:20px;
  font-size:10.5px;
  color:rgba(255,255,255,.75);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:600;
  position:relative;
  z-index:2;
  animation:fadeUp .7s cubic-bezier(.19,1,.22,1) .35s backwards, bounceHint 2s ease-in-out infinite .9s;
}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes bounceHint{0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);}}

/* ============================================================
   STACKED CARD SWITCHER
   ============================================================ */
.stack-wrap{
  padding:30px 14px 34px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}
.stack{
  position:relative;
  width:100%;
  height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:pan-y;
}
.stack-card{
  position:absolute;
  width:70%;
  height:190px;
  border-radius:16px;
  padding:20px 16px;
  overflow:hidden;
  cursor:pointer;
  user-select:none;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  animation:cardPopIn .55s cubic-bezier(.2,.9,.3,1.2) backwards;
  transition:transform .4s cubic-bezier(.19,1,.22,1), opacity .4s ease, box-shadow .4s ease;
  box-shadow:3px 5px 0 rgba(11,11,20,.14);
  border:2.5px solid var(--ink);
}
.stack-card.doctors{background:var(--yellow); animation-delay:.1s;}
.stack-card.centers{background:var(--pink); animation-delay:.22s;}
.stack-card.assistants{background:var(--green); animation-delay:.34s;}
@keyframes cardPopIn{from{opacity:0;} to{opacity:1;}}
.stack-card .k{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:19px;
}
.stack-card[data-front="true"] .k{font-size:22px;}
.stack-card.assistants .k, .stack-card.assistants .p, .stack-card.assistants .tap-hint{color:#fff;}
.stack-card .p{font-size:11.5px; margin-top:4px; font-weight:500; opacity:.85;}
.stack-card .arrow{
  position:absolute;
  right:14px; bottom:14px;
  font-size:24px;
  line-height:1;
  filter:brightness(0);
  opacity:0;
  transition:opacity .3s ease;
  display:inline-block;
}
.stack-card[data-front="true"] .arrow{opacity:1; animation:pointWiggle 1.6s ease-in-out infinite;}
@keyframes pointWiggle{0%,100%{transform:translateX(0);} 50%{transform:translateX(5px);}}
.stack-card .tap-hint{
  position:absolute; left:16px; bottom:8px;
  font-size:9px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  opacity:0; transition:opacity .25s ease;
}
.stack-card[data-front="true"] .tap-hint{opacity:.6;}
.stack-dots{display:flex; gap:6px; margin-top:16px;}
.dot{width:7px; height:7px; border-radius:50%; background:#d8d3c4; cursor:pointer; transition:background .25s ease, transform .25s ease;}
.dot.active{background:var(--ink); transform:scale(1.25);}
.stack-caption{margin-top:10px; font-size:10px; color:#999; text-align:center;}

/* ============================================================
   FOOTER
   ============================================================ */
.foot-black{
  margin-top:auto;
  background:var(--ink);
  color:#cfd2df;
  padding:24px 18px;
  font-size:10.5px;
  line-height:1.7;
}
.foot-black .flogo{
  font-family:'Baloo 2',sans-serif;
  color:var(--yellow);
  font-size:16px;
  margin-bottom:6px;
  transform:rotate(-1deg);
  display:inline-block;
}
.foot-black a{color:#cfd2df; text-decoration:underline;}

/* ============================================================
   LIST PAGES
   ============================================================ */
.list-top{padding:20px 16px 18px; color:#fff; position:relative; overflow:hidden;}
.list-top.doctors-top{background:var(--blue);}
.list-top.centers-top{background:var(--pink);}
.list-top.assistants-top{background:var(--green);}
.list-top .dots-overlay{
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.12) 1.4px, transparent 1.4px);
  background-size:14px 14px;
  pointer-events:none;
}
.back-row{font-size:11px; opacity:.9; margin-bottom:8px; font-weight:700; cursor:pointer; position:relative; z-index:1;}
.list-title{font-family:'Baloo 2',sans-serif; font-size:22px; position:relative; z-index:1;}
.filters-label{font-size:10px; opacity:.8; margin-top:10px; font-weight:500; position:relative; z-index:1;}
.filters{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; position:relative; z-index:1;}
.chip{
  background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.4);
  color:#fff; font-size:10px; font-weight:700;
  padding:6px 11px; border-radius:20px; cursor:pointer;
  transition:background .2s ease, color .2s ease, transform .15s ease;
}
.chip:active{transform:scale(.95);}
.chip.active{background:var(--yellow); color:var(--ink); border-color:var(--yellow);}

.grid-cards{padding:18px 16px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.p-card{
  background:var(--card);
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:2px 3px 0 rgba(11,11,20,.1);
  border:2px solid var(--ink);
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease;
}
.p-card:nth-child(odd){transform:rotate(-1.2deg);}
.p-card:nth-child(even){transform:rotate(1.2deg);}
.p-card:hover{transform:translateY(-4px) rotate(0deg); box-shadow:3px 5px 0 rgba(11,11,20,.16);}
.p-avatar{
  width:100%; aspect-ratio:1; border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--pink));
  background-size:cover; background-position:center;
  margin-bottom:8px;
  position:relative;
  overflow:hidden;
}
.p-avatar::after{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.25) 1px, transparent 1px);
  background-size:7px 7px;
}
.p-name{font-family:'Baloo 2',sans-serif; font-size:12.5px;}
.p-sub{font-size:9.5px; color:#888; margin-top:2px;}
.empty-state{padding:40px 20px; text-align:center; color:#999; font-size:12px;}

.a-card{
  background:var(--card);
  border-radius:14px;
  padding:12px;
  display:flex; gap:12px; align-items:center;
  box-shadow:2px 3px 0 rgba(11,11,20,.1);
  border:2px solid var(--ink);
  margin-bottom:12px;
  width:100%;
  box-sizing:border-box;
  transition:transform .2s ease;
}
.a-card:hover{transform:translateX(3px);}
.a-avatar{
  width:52px;height:52px; border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--yellow));
  background-size:cover; background-position:center;
  flex:0 0 auto;
  border:2px solid var(--ink);
}
.a-info .a-name{font-family:'Baloo 2',sans-serif; font-size:13px;}
.a-info .a-sub{font-size:10px; color:#888; margin-top:2px;}
.a-info .a-contact{font-size:9.5px; color:var(--blue-deep); margin-top:4px; font-weight:700;}
.a-list-wrap{padding:18px 16px;width:100%;box-sizing:border-box;}

/* ============================================================
   DETAIL PAGES
   ============================================================ */
.detail-hero{padding:22px 18px 60px; color:#fff; position:relative; overflow:hidden;}
.detail-hero.doctors-hero{background:var(--blue);}
.detail-hero.centers-hero{background:var(--pink);}
.detail-hero .dots-overlay{
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.12) 1.4px, transparent 1.4px);
  background-size:14px 14px;
  pointer-events:none;
}
.detail-avatar{
  width:90px;height:90px; border-radius:50%;
  background:linear-gradient(135deg,var(--yellow),var(--pink));
  background-size:cover; background-position:center;
  border:3.5px solid #fff;
  margin:6px auto 10px;
  position:relative; z-index:1;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.detail-name{font-family:'Baloo 2',sans-serif; font-size:20px; text-align:center; position:relative; z-index:1;}
.detail-sub{text-align:center; font-size:11px; opacity:.9; margin-top:2px; position:relative; z-index:1;}
.detail-card{
  background:var(--paper);
  margin:-40px 14px 0;
  border-radius:16px;
  padding:16px;
  position:relative;
  box-shadow:3px 5px 0 rgba(11,11,20,.14);
  border:2px solid var(--ink);
}
.d-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed #ddd; font-size:11.5px; gap:10px;}
.d-row:last-child{border-bottom:none;}
.d-row .lbl{color:#888; font-weight:700; flex:0 0 auto;}
.d-row .val{font-weight:600; text-align:right;}
.d-row .val.link{color:var(--blue-deep); cursor:pointer; text-decoration:underline;}
.d-row .val.desc{font-weight:400; text-align:left; color:#333;}

.tabs{display:flex; margin:16px 14px 0; background:#fff; border-radius:12px; overflow:hidden; border:2px solid var(--ink);}
.tab{flex:1; text-align:center; padding:10px; font-size:11px; font-weight:700; color:#999; cursor:pointer; transition:background .2s ease, color .2s ease;}
.tab.active{background:var(--ink); color:var(--yellow);}

.tab-panel{padding:0 14px 20px; margin-top:12px;}
.review{
  background:#fff; padding:12px; border-radius:14px;
  box-shadow:2px 3px 0 rgba(11,11,20,.08); border:1.5px solid #eee;
  margin-bottom:12px;
}
.review .rn{font-family:'Baloo 2',sans-serif; font-size:12px;}
.review .stars{color:#e8b800; font-size:11px; margin:2px 0;}
.review .rt{font-size:10.5px; color:#666; line-height:1.5;}

.review-form{
  background:#fff; padding:14px; border-radius:14px;
  box-shadow:2px 3px 0 rgba(11,11,20,.08); border:1.5px solid #eee;
  margin-bottom:14px;
}
.review-form input, .review-form textarea, .review-form select{
  width:100%; border:1.5px solid #e5e5e5; border-radius:10px;
  padding:9px 10px; font-size:12px; font-family:inherit; margin-top:6px;
}
.review-form input:focus, .review-form textarea:focus{outline:2px solid var(--blue); border-color:var(--blue);}
.review-form label{font-size:10.5px; font-weight:700; color:#666; display:block; margin-top:10px;}
.review-form .stars-input{display:flex; gap:4px; margin-top:6px; font-size:20px; cursor:pointer;}
.review-form .stars-input span{opacity:.3; transition:opacity .15s ease;}
.review-form .stars-input span.on{opacity:1;}
.btn{
  margin-top:14px; background:var(--pink); color:#fff; text-align:center;
  padding:11px; border-radius:12px; font-weight:700; font-size:12px;
  font-family:'Baloo 2',sans-serif; width:100%; cursor:pointer;
  border:2px solid var(--ink);
  box-shadow:2px 3px 0 rgba(11,11,20,.2);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:translate(2px,3px); box-shadow:0 0 0 rgba(11,11,20,.2);}
.btn.secondary{background:#efefef; color:var(--ink);}
.btn.google{background:#fff; color:#333; display:flex; align-items:center; justify-content:center; gap:8px;}

.signin-prompt{
  background:#fff; padding:16px; border-radius:14px; text-align:center;
  box-shadow:2px 3px 0 rgba(11,11,20,.08); border:1.5px solid #eee;
  margin-bottom:14px;
}
.signin-prompt p{font-size:11.5px; color:#666; margin:0 0 10px;}
.signed-in-row{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#666; margin-bottom:10px;}
.signed-in-row button{color:var(--blue-deep); font-weight:700; font-size:11px;}

/* ============================================================
   UTILITY
   ============================================================ */
.loading{padding:40px; text-align:center; color:#999; font-size:12px;}
:focus-visible{outline:3px solid var(--blue-deep); outline-offset:2px;}


/* ============================================================
   RESPONSIVE LAYOUT — mobile, tablet and laptop/desktop
   ============================================================ */
@media (min-width: 600px){
  #app{max-width:900px;}
  .hero{padding:46px 42px 54px;}
  .stack-wrap{padding:38px 34px 42px;}
  .stack{height:260px;}
  .stack-card{width:min(52%,360px);height:210px;padding:24px 20px;}
  .grid-cards{grid-template-columns:repeat(3,1fr);padding:24px 30px;gap:18px;}
  .a-list-wrap{padding:24px 30px;}
  .detail-hero{padding-left:30px;padding-right:30px;}
  .detail-card{margin-left:30px;margin-right:30px;}
  .tabs{margin-left:30px;margin-right:30px;}
  .tab-panel{padding-left:30px;padding-right:30px;}
  .profile-card{margin-left:30px;margin-right:30px;}
}
@media (min-width: 901px){
  #app{max-width:1200px;}
  .hero{padding:56px 70px 68px;}
  .hero-story{max-width:720px;font-size:14px;}
  .stack-wrap{padding:48px 70px 54px;}
  .stack{height:300px;}
  .stack-card{width:360px;height:230px;}
  .grid-cards{grid-template-columns:repeat(4,1fr);padding:28px 70px;gap:22px;}
  .a-list-wrap{padding:28px 70px;max-width:900px;width:100%;box-sizing:border-box;margin:auto;}
  .detail-hero{padding-left:70px;padding-right:70px;}
  .detail-card{margin-left:70px;margin-right:70px;}
  .tabs{margin-left:70px;margin-right:70px;}
  .tab-panel{padding-left:70px;padding-right:70px;}
  .profile-card{margin-left:70px;margin-right:70px;}
}
@media (max-width: 599px){
  .profile-trigger{right:14px;top:58px;left:auto;}
  .hero-sticker{right:18px;top:16px;}
}
@media (min-width: 600px){
  .profile-trigger{top:62px;}
  .hero-sticker{top:18px;right:22px;}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}


/* PERSONALIZED EXPERIENCE */
.profile-trigger{position:absolute;top:62px;right:18px;z-index:5;background:#fff;color:var(--blue-deep);border:2px solid var(--ink);border-radius:999px;padding:7px 11px;font-size:10px;font-weight:800;box-shadow:2px 3px 0 rgba(11,11,20,.18)}
.profile-trigger .mini-avatar{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:var(--yellow);margin-right:5px;font-size:13px;vertical-align:middle}
.auth-overlay{position:fixed;inset:0;background:rgba(0,1,128,.52);display:flex;align-items:flex-end;justify-content:center;z-index:1000;padding:14px}
.auth-modal{width:min(480px,100%);max-height:92vh;overflow:auto;background:#fff;border:2.5px solid var(--ink);border-radius:24px 24px 16px 16px;box-shadow:6px 8px 0 rgba(0,0,0,.18);padding:20px}
.auth-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.auth-title{font-family:'Baloo 2';font-size:25px;color:var(--blue-deep)}.auth-close{font-size:24px;font-weight:800}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.role-card{border:2px solid var(--ink);border-radius:15px;padding:14px;background:var(--frost);text-align:left;cursor:pointer}.role-card.doctor{background:var(--pink)}.role-card strong{display:block;font-family:'Baloo 2';font-size:18px}.role-card span{font-size:10px;color:#333}

  <script>
// ============================================================
// CONFIG — fill these in when ready. The site works with sample
// data out of the box, so you can preview it before connecting
// anything real.
// ============================================================
const CONFIG = {
  // Paste your Google Sheet ID (the long string in the sheet's URL
  // between /d/ and /edit). Leave empty to use sample data.
  SHEET_ID: "",

  // Google Analytics 4 Measurement ID (e.g. "G-XXXXXXX"). Leave empty to skip.
  GA_MEASUREMENT_ID: "",

  // Firebase config object from your Firebase project settings.
  // Leave as null to run reviews in local demo mode (saved in this
  // browser only) until Firebase is connected.
  FIREBASE_CONFIG: null,

  // Doctor access: add each listed doctor here with the password
  // supplied privately by the site owner. Example:
  // "Dr. Ahmed Sami": "replace-with-real-password"
  DOCTOR_PASSWORDS: {}
};

// ============================================================
// DATA LAYER
// ============================================================
const Data = (() => {
  let cache = null;

  function csvUrl(sheetName) {
    return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  }

  // Minimal CSV parser (handles quoted fields with commas/newlines)
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r') { /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ""));
  }

  function rowsToObjects(rows) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    });
  }

  function mapDoctor(o) {
    return {
      picture: o["Picture (Drive link or upload)"] || o["Picture"] || "",
      name: o["Name"] || "",
      level: o["AL / OL / Both"] || "",
      subject: o["Subject"] || "",
      description: o["Description"] || "",
      mobile: o["Mobile Number"] || "",
      social: o["Social Media (Insta/FB link)"] || "",
      howToEnroll: o["How to Enroll"] || "",
      orientationLink: o["Orientation Session Link (recorded)"] || o["Orientation Session Link"] || ""
    };
  }
  function mapCenter(o) {
    return {
      picture: o["Picture (Drive link or upload)"] || o["Picture"] || "",
      name: o["Center Name"] || "",
      contact: o["Contact Number"] || "",
      location: o["Location"] || ""
    };
  }
  function mapAssistant(o) {
    return {
      picture: o["Picture (Drive link or upload)"] || o["Picture"] || "",
      name: o["Name"] || "",
      number: o["Number"] || "",
      subject: o["Subject"] || ""
    };
  }

  async function fetchSheet(sheetName, mapper) {
    const res = await fetch(csvUrl(sheetName), { cache: "no-store" });
    if (!res.ok) throw new Error("Sheet fetch failed: " + sheetName);
    const text = await res.text();
    const rows = parseCSV(text);
    return rowsToObjects(rows).map(mapper);
  }

  async function loadAll(forceRefresh = false) {
    if (cache && !forceRefresh) return cache;

    if (!CONFIG.SHEET_ID) {
      cache = window.SAMPLE_DATA;
      return cache;
    }

    try {
      const [doctors, centers, assistants] = await Promise.all([
        fetchSheet("Doctors", mapDoctor),
        fetchSheet("Centers", mapCenter),
        fetchSheet("Assistants", mapAssistant)
      ]);
      cache = { doctors, centers, assistants };
    } catch (e) {
      console.warn("Falling back to sample data:", e);
      cache = window.SAMPLE_DATA;
    }
    return cache;
  }

  function slugify(name, idx) {
    return (name || "item").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") + "-" + idx;
  }

  return { loadAll, slugify };
})();

const Reviews = (() => {

  async function signInWithGoogle(){initFirebase();if(firebaseReady&&auth){const provider=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(provider);return true}return true}
  function isSignedIn(){if(firebaseReady&&auth)return!!auth.currentUser;return!!getDisplayName()||localStorage.getItem("metlaghbat_demo_signed_in")==="1"} function signInDemo(){localStorage.setItem("metlaghbat_demo_signed_in","1");localStorage.removeItem(GUEST_KEY)}
  function isGuest(){return localStorage.getItem(GUEST_KEY)==="1"} function continueAsGuest(){localStorage.setItem(GUEST_KEY,"1");localStorage.removeItem("metlaghbat_demo_signed_in");localStorage.removeItem(NAME_KEY);localStorage.removeItem(AVATAR_KEY);localStorage.removeItem(ROLE_KEY)}
  function signOut(){if(firebaseReady&&auth)auth.signOut();localStorage.removeItem("metlaghbat_demo_signed_in");localStorage.removeItem(GUEST_KEY);localStorage.removeItem(NAME_KEY);localStorage.removeItem(AVATAR_KEY);localStorage.removeItem(ROLE_KEY)}
  return {list,add,getDisplayName,setDisplayName,getAvatar,setAvatar,getRole,setRole,getDoctorOverrides,saveDoctorOverrides,vote,getVote,signInWithGoogle,signInDemo,isSignedIn,isGuest,continueAsGuest,signOut,initFirebase};
})();

function route() {
  const hash = location.hash.slice(1) || "/";
  const parts = hash.split("/").filter(Boolean);

  if (parts.length === 0) return renderHome();
  if (parts[0] === "doctors" && parts[1]) return renderDetail("doctors", parts[1]);
  if (parts[0] === "doctors") return renderList("doctors");
  if (parts[0] === "centers" && parts[1]) return renderDetail("centers", parts[1]);
  if (parts[0] === "centers") return renderList("centers");
  if (parts[0] === "assistants" && parts[1]) return renderAssistantDetail(parts[1]);
  if (parts[0] === "assistants") return renderList("assistants");
  return renderHome();
}

function initStack() {
  updateHomeProfile();
  const stackEl = document.getElementById("cardStack");
  if (!stackEl) return;
  const cards = Array.from(stackEl.querySelectorAll(".stack-card"));
  const dots = Array.from(document.querySelectorAll(".dot"));
  const routes = ["#/doctors", "#/centers", "#/assistants"];
  let front = 0;
  const total = cards.length;

  function render() {
    cards.forEach((card, i) => {
      let offset = i - front;
      if (offset > total / 2) offset -= total;
      if (offset < -total / 2) offset += total;
      const isFront = offset === 0;
      card.setAttribute("data-front", isFront ? "true" : "false");
      const translateX = offset * 62;
      const scale = isFront ? 1 : 0.78;
      card.style.zIndex = 10 - Math.abs(offset);
      card.style.transform = `translateX(${translateX}%) scale(${scale})`;
      card.style.opacity = Math.abs(offset) > 1 ? 0 : (isFront ? 1 : 0.55);
    });
    dots.forEach((d, i) => d.classList.toggle("active", i === front));
  }
  function goTo(i) { front = ((i % total) + total) % total; render(); }

  dots.forEach(d => d.addEventListener("click", () => goTo(parseInt(d.dataset.go, 10))));
  cards.forEach((card, i) => {
    card.addEventListener("click", () => {
      if (card.getAttribute("data-front") === "true") {
        location.hash = routes[i];
      } else {
        goTo(i);
      }
    });
  });

  let startX = 0, startY = 0, dragging = false;
  stackEl.addEventListener("pointerdown", e => { dragging = true; startX = e.clientX; startY = e.clientY; });
  stackEl.addEventListener("pointerup", e => {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goTo(front + 1); else goTo(front - 1);
    }
  });
  stackEl.addEventListener("pointerleave", () => { dragging = false; });

  render();
}

function filtersMarkup(type) {
  if (type === "doctors") {
    return `
      <div class="filters-label">showing all doctors — tap to filter</div>
      <div class="filters">
        <div class="chip active" data-filter="level" data-value="all">All</div>
        <div class="chip" data-filter="level" data-value="AL">AL</div>
        <div class="chip" data-filter="level" data-value="OL">OL</div>
        <div class="chip" data-filter="subject" data-value="Math">Math</div>
        <div class="chip" data-filter="subject" data-value="Physics">Physics</div>
        <div class="chip" data-filter="subject" data-value="Chem">Chem</div>
        <div class="chip" data-filter="subject" data-value="Bio">Bio</div>
        <div class="chip" data-filter="subject" data-value="English">English</div>
      </div>
    `;
  }
  if (type === "centers") {
    return `
      <div class="filters-label">showing all centers — tap to filter</div>
      <div class="filters">
        <div class="chip active" data-filter="location" data-value="all">All</div>
      </div>
    `;
  }
  return "";
}

function wireFilters(type) {
  currentFilters = { level: "all", subject: "all", location: "all" };
  const chips = document.querySelectorAll(".chip");
  chips.forEach(chip => {
    chip.addEventListener("click", async () => {
      const filterKey = chip.dataset.filter;
      const value = chip.dataset.value;

      if (value === "all") {
        currentFilters[filterKey] = "all";
        document.querySelectorAll(`.chip[data-filter="${filterKey}"]`).forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
      } else {
        currentFilters[filterKey] = currentFilters[filterKey] === value ? "all" : value;
        document.querySelectorAll(`.chip[data-filter="${filterKey}"]`).forEach(c => c.classList.remove("active"));
        const target = currentFilters[filterKey] === "all"
          ? document.querySelector(`.chip[data-filter="${filterKey}"][data-value="all"]`)
          : chip;
        if (target) target.classList.add("active");
      }

      const data = await Data.loadAll();
      renderListBody(type, data[type] || []);
    });
  });
}

function applyFilters(type, items) {
  if (type === "doctors") {
    return items.filter(d => {
      const levelOk = currentFilters.level === "all" || d.level === currentFilters.level || d.level === "Both";
      const subjectOk = currentFilters.subject === "all" || d.subject === currentFilters.subject;
      return levelOk && subjectOk;
    });
  }
  return items;
}

function renderListBody(type, items) {
  const body = document.getElementById("listBody");
  if (!body) return;
  const filtered = applyFilters(type, items);

  if (!filtered.length) {
    body.innerHTML = `<div class="empty-state">Nothing here yet — check back soon.</div>`;
    return;
  }

  if (type === "assistants") {
    body.innerHTML = filtered.map(a => `
      <div class="a-card" onclick="location.hash='#/assistants/${Data.slugify(a.name, items.indexOf(a))}'" style="cursor:pointer">
        <div class="a-avatar" style="${a.picture ? `background-image:url('${escapeHtml(a.picture)}')` : ""}"></div>
        <div class="a-info">
          <div class="a-name">${escapeHtml(a.name)}</div>
          <div class="a-sub">${escapeHtml(a.subject || "")}</div>
          <div class="a-contact">${escapeHtml(a.number || "")}</div>
        </div>
      </div>
    `).join("");
    return;
  }

  body.innerHTML = filtered.map((item, i) => {
    const id = Data.slugify(item.name, i);
    const sub = type === "doctors" ? `${item.subject} · ${item.level}` : (item.location || "");
    return `
      <div class="p-card" onclick="location.hash='#/${type}/${id}'">
        <div class="p-avatar" style="${item.picture ? `background-image:url('${escapeHtml(item.picture)}')` : ""}"></div>
        <div class="p-name">${escapeHtml(item.name)}</div>
        <div class="p-sub">${escapeHtml(sub)}</div>
      </div>
    `;
  }).join("");
}

function wireTabs(entityType,entityId,entityName){const tabs=document.querySelectorAll('.tab'),panel=document.getElementById('tabPanel');function showInfo(){panel.innerHTML=''}async function showReviews(){panel.innerHTML='<div class="loading">loading reviews...</div>';const items=await Reviews.list(entityType,entityId),signedIn=Reviews.isSignedIn();let html='';if(signedIn){const name=Reviews.getDisplayName();html+=`<div class="signed-in-row"><span>Posting as <b>${escapeHtml(name||'you')}</b></span><button onclick="Reviews.signOut();wireTabs('${entityType}','${entityId}','${escapeHtml(entityName)}');document.querySelector('.tab[data-tab=reviews]').click()">Sign out</button></div><div class="review-form">${!name?`<label>Pick a display name</label><input id="displayNameInput" placeholder="e.g. nour_ig"/>`:''}<label>Your rating</label><div class="stars-input" id="starsInput">${[1,2,3,4,5].map(n=>`<span data-n="${n}">★</span>`).join('')}</div>${entityType==='doctors'?`<div class="poll"><div class="poll-q">Would you take a lesson with ${escapeHtml(entityName)}?</div><div class="poll-actions"><button class="poll-btn ${Reviews.getVote(entityId)==='yes'?'selected':''}" id="pollYes" onclick="choosePoll('${entityId}','yes')">YES ✓</button><button class="poll-btn ${Reviews.getVote(entityId)==='no'?'selected':''}" id="pollNo" onclick="choosePoll('${entityId}','no')">NO ✕</button></div><div class="poll-result" id="pollResult"></div></div>`:''}<label>Your review</label><textarea id="reviewText" rows="3" placeholder="How was your experience?"></textarea><div class="btn" id="submitReview">Post review</div></div>`}else html+=`<div class="signin-prompt"><p>Sign in to write reviews and vote in polls</p><div class="btn google" id="signInGoogle">Sign in with Google</div><div class="btn secondary" id="signInEmail" style="margin-top:8px">Create a student profile</div></div>`;if(!items.length)html+='<div class="empty-state">No reviews yet — be the first!</div>';else html+=items.map(r=>`<div class="review"><div class="rn">— ${escapeHtml(r.displayName||'anonymous')}</div><div class="stars">${'★'.repeat(r.stars||0)}${'☆'.repeat(5-(r.stars||0))}</div>${r.poll?`<div class="profile-badge" style="margin:3px 0">lesson poll: ${r.poll==='yes'?'YES':'NO'}</div>`:''}<div class="rt">${escapeHtml(r.text||'')}</div></div>`).join('');panel.innerHTML=html;const g=document.getElementById('signInGoogle');if(g)g.addEventListener('click',async()=>{await Reviews.signInWithGoogle();Reviews.signInDemo();openAuth();showStudentAuth()});const e=document.getElementById('signInEmail');if(e)e.addEventListener('click',()=>{Reviews.signInDemo();openAuth();showStudentAuth()});let selectedStars=0;const stars=document.getElementById('starsInput');if(stars)stars.querySelectorAll('span').forEach(st=>st.addEventListener('click',()=>{selectedStars=+st.dataset.n;stars.querySelectorAll('span').forEach(x=>x.classList.toggle('on',+x.dataset.n<=selectedStars))}));const submit=document.getElementById('submitReview');if(submit)submit.addEventListener('click',async()=>{let name=Reviews.getDisplayName(),ni=document.getElementById('displayNameInput');if(!name&&ni){name=ni.value.trim();if(!name){alert('Pick a display name first');return}Reviews.setDisplayName(name)}const text=document.getElementById('reviewText').value.trim();if(!selectedStars){alert('Pick a star rating');return}if(!text){alert('Write a short review');return}await Reviews.add(entityType,entityId,{displayName:name,stars:selectedStars,text,poll:entityType==='doctors'?Reviews.getVote(entityId):''});showReviews()});if(entityType==='doctors')renderPollResult(entityId,items)}tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(t=>t.classList.remove('active'));tab.classList.add('active');tab.dataset.tab==='info'?showInfo():showReviews()}))}
function choosePoll(id,c){Reviews.vote(id,c);const yes=document.getElementById('pollYes'),no=document.getElementById('pollNo');if(yes)yes.classList.toggle('selected',c==='yes');if(no)no.classList.toggle('selected',c==='no');const result=document.getElementById('pollResult');if(result)result.textContent=c==='yes'?'You voted YES':'You voted NO'}
function renderPollResult(id,items){const el=document.getElementById('pollResult');if(!el)return;const voted=items.filter(x=>x.poll),yes=voted.filter(x=>x.poll==='yes').length,no=voted.filter(x=>x.poll==='no').length;el.textContent=voted.length?`${yes} yes · ${no} no`:'Be the first vote'}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
